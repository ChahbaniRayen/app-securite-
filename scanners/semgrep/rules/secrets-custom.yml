rules:
  - id: custom.config.hardcoded-secret
    message: >
      Secret/mot de passe en clair dans un fichier de configuration.
      Utiliser des variables d environnement / coffre-fort. Ref: CR-004
      (JWT_SECRET=crapi dans docker-compose.yml).
    languages: [generic]
    severity: WARNING
    metadata:
      cwe: CWE-798
      owasp: "A07:2025 Identification and Authentication Failures"
      confidence: HIGH
    paths:
      include:
        - "*.yml"
        - "*.yaml"
        - "*.env"
        - "*.properties"
        - "*.ini"
        - "*.conf"
        - "*.json"
        - "**/*.yml"
        - "**/*.yaml"
        - "**/*.env"
        - "**/*.json"
    patterns:
      - pattern-regex: '(?i)\b(password|passwd|secret|token|api[_-]?key|private[_-]?key)\b\s*[:=]\s*[A-Za-z0-9@#$%^&*_-]{6,}'
      - pattern-not-regex: '(?i)(example|changeme|placeholder|your[_-]|xxx)'
