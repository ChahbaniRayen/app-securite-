rules:
  # --- JS-001 : injection SQL dans les requetes brutes (pattern TP2) ---
  - id: custom.js.sequelize.raw-query-user-input
    message: >
      Requete SQL construite par concatenation/interpolation d'une entree
      utilisateur (req.body/query/params). Utiliser des requetes preparees
      (bind/parametres liees). Ref: TP2 Phase 5 (remediation).
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    metadata:
      cwe: CWE-89
      owasp: "A05:2025 Injection"
      ground_truth: JS-001
      confidence: HIGH
    pattern-sources:
      - pattern-either:
          - pattern: req.body.$F
          - pattern: req.query.$F
          - pattern: req.params.$F
          - pattern: req.body.$F || $_
          - pattern: req.query.$F || $_
          - pattern: req.params.$F || $_
          - pattern: req.body[$K]
          - pattern: req.query[$K]
          - pattern: request.body.$F
          - pattern: request.query.$F
          - pattern: request.body.$F || $_
          - pattern: request.query.$F || $_
    pattern-sinks:
      - pattern-either:
          - pattern: $DB.query(`...`)
          - pattern: $DB.query(`...${...}...`)
          - pattern: $DB.query($STR + $X)
          - pattern: $DB.query($X + $STR)
          - pattern: $DB.raw(`...${...}...`)
    pattern-sanitizers:
      - pattern: sequelize.escape(...)
      - pattern: $DB.escape(...)

  # --- variante regex de repli (couvre les cas hors taint) ---
  - id: custom.js.sequelize.raw-query-regex
    message: >
      Template literal SQL contenant req.body/req.query/req.params (injection
      SQL possible, CWE-89).
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: CWE-89
      owasp: "A05:2025 Injection"
      ground_truth: JS-001
      confidence: MEDIUM
    patterns:
      - pattern: $DB.query(`...${$SRC}...`)
      - metavariable-regex:
          metavariable: $SRC
          regex: (req|request)\.(body|query|params)
